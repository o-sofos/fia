[test]
# Registers happy-dom, resets the DOM before each test and fails tests that
# leave the runtime dirty. See src/testing/setup.ts.
preload = ["./src/testing/setup.ts"]

# Coverage is gated on totals by scripts/coverage-gate.ts (bun's own
# coverageThreshold is per-file).
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["src/testing/**"]
